<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>سایبرکوییز | CyberQuiz</title>

    <style>
      /* استایل پایه تیره برای جلوگیری از هرگونه پرش رنگ */
      html, body {
        margin: 0;
        padding: 0;
        background-color: #020617;
        color: #f8fafc;
        min-height: 100vh;
        overflow-x: hidden;
        font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
      }

      /* لودر اولیه بسیار سبک تا زمان بالا آمدن ری‌اکت */
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
        z-index: 99999;
      }

      .cyber-logo-text {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: 2px;
        color: #38bdf8;
        text-shadow: 0 0 16px rgba(56, 189, 248, 0.6);
        margin-bottom: 20px;
      }

      .cyber-spinner {
        width: 48px;
        height: 48px;
        border: 3px solid rgba(56, 189, 248, 0.15);
        border-top-color: #06b6d4;
        border-radius: 50%;
        animation: cyber-spin 0.8s linear infinite;
      }

      @keyframes cyber-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-[#020617] text-slate-100">
    <div id="root">
      <!-- تا زمانی که ری‌اکت لود شود این لودر زیبا دیده می‌شود و با آمدن ری‌اکت فوراً محو می‌شود -->
      <div id="initial-loader">
        <div class="cyber-logo-text">CYBER QUIZ</div>
        <div class="cyber-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
